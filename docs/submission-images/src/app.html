<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<script src="shared.js"></script>
<style>
  .canvas { height: 610px; }
  .intro { padding: 30px 40px 0; }
  .intro .lede { margin-top: 10px; max-width: 760px; }
  .phones { position: absolute; left: 40px; top: 150px; display: flex; gap: 18px; }
  .phones .phone { width: 186px; }

  .stack { position: absolute; left: 680px; right: 40px; top: 208px; display: flex; flex-direction: column; align-items: stretch; }
  .card {
    border-radius: 18px;
    padding: 16px 18px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(6px);
    box-shadow: 0 0 0 1px var(--faint), 0 14px 30px rgba(0, 0, 0, 0.35);
  }
  .card .k { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--amber); }
  .card h3 { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin-top: 3px; }
  .card p { font-size: 14px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 12.5px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); color: var(--ink); }
  .card.alarm { background: linear-gradient(135deg, #3b2160, #241b45); box-shadow: 0 0 0 1px rgba(201, 184, 255, 0.35), 0 0 40px rgba(201, 184, 255, 0.18); }
  .card.alarm .k { color: var(--snooze); }
  .card.alarm p { color: rgba(255, 255, 255, 0.75); }
  .card.alarm .chip { background: rgba(255, 255, 255, 0.12); color: #fff; }
  .link { display: flex; align-items: center; gap: 10px; height: 38px; padding-left: 24px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .link::before { content: ""; width: 2px; height: 100%; background: repeating-linear-gradient(var(--muted) 0 4px, transparent 4px 8px); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
</style>
</head>
<body>
<div class="canvas">
  <div id="sky"></div>
  <div id="header"></div>
  <div class="intro">
    <h1>The iPhone app</h1>
  </div>

  <div class="phones">
    <div class="phone"><img src="../../../web/public/app/play-night.webp"></div>
    <div class="phone"><img src="../../screenshots/full/night-full.png"></div>
    <div class="phone"><img src="../../../web/public/app/history.webp"></div>
  </div>

  <div class="stack">
    <div class="card">
      <div class="k">The app</div>
      <h3>Expo SDK 58 · React Native 0.88</h3>
      <div class="chips">
        <span class="chip">Expo Router</span>
        <span class="chip">Reanimated 4</span>
        <span class="chip">react-native-svg</span>
        <span class="chip">expo-audio</span>
      </div>
    </div>
    <div class="link">Custom Expo module in Swift: <code>lottery-alarm</code></div>
    <div class="card alarm">
      <div class="k">Real alarms</div>
      <h3>AlarmKit · iOS 26</h3>
      <div class="chips">
        <span class="chip">Lock Screen</span>
        <span class="chip">Rings through Silent and Focus</span>
        <span class="chip">Snooze ends at your target</span>
      </div>
    </div>
  </div>
</div>
<script>
  document.getElementById("header").innerHTML = header();
  document.getElementById("sky").innerHTML = sky({ graveyard: null, stars: 90 });
</script>
</body>
</html>
